<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>愚痴吐き場｜匿名で愚痴を書き込める掲示板</title>

<meta name="description"
content="誰にも言えない愚痴を匿名で吐き出せる掲示板。学校、仕事、人間関係、恋愛など、何でも気軽に書き込めます。">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f5f7;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

header {
  background: #222;
  color: white;
  padding: 35px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin: 10px 0 0;
  color: #ccc;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px 15px 50px;
}

.post-box {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,.07);
}

textarea {
  width: 100%;
  height: 120px;
  resize: none;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  outline: none;
}

textarea:focus {
  border-color: #555;
}

.post-button {
  width: 100%;
  margin-top: 10px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #222;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.post-button:active {
  transform: scale(.98);
}

.notice {
  font-size: 12px;
  color: #777;
  margin-top: 10px;
  line-height: 1.6;
}

.search {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 15px;
  margin-bottom: 15px;
}

.section-title {
  font-size: 20px;
  font-weight: bold;
  margin: 20px 0 12px;
}

.post {
  background: white;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.post-content {
  font-size: 16px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}

.post-info {
  color: #999;
  font-size: 12px;
  margin-top: 12px;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.action {
  border: 1px solid #ddd;
  background: #fafafa;
  border-radius: 20px;
  padding: 7px 12px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #888;
  padding: 30px;
}

.status {
  text-align: center;
  font-size: 12px;
  color: #888;
  margin: 10px 0;
}

footer {
  text-align: center;
  color: #888;
  font-size: 12px;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>🗯️ 愚痴吐き場</h1>
  <p>誰にも言えないこと、ここに吐き出そう。</p>
</header>

<main class="container">

  <section class="post-box">

    <textarea
      id="message"
      maxlength="1000"
      placeholder="今日あった嫌なこと、誰にも言えないことを書いてみよう……"
    ></textarea>

    <button
      id="postButton"
      class="post-button"
      type="button">
      投稿する
    </button>

    <div class="notice">
      ※完全な匿名を保証するものではありません。<br>
      本名・住所・電話番号などの個人情報は書かないでください。
    </div>

  </section>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="🔍 投稿を検索..."
  >

  <div id="status" class="status"></div>

  <div class="section-title">
    💬 新着の愚痴
  </div>

  <div id="posts"></div>

</main>

<footer>
  © 2026 愚痴吐き場
</footer>

<script>

const messageInput =
  document.getElementById("message");

const postButton =
  document.getElementById("postButton");

const searchInput =
  document.getElementById("search");

const postsContainer =
  document.getElementById("posts");

const statusText =
  document.getElementById("status");


let allPosts = [];


/* 投稿を取得 */

async function loadPosts() {

  try {

    const response =
      await fetch("/api/posts", {
        cache: "no-store"
      });

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    allPosts =
      await response.json();

    displayPosts();

    statusText.textContent =
      "自動更新中";

  } catch (error) {

    console.error(error);

    statusText.textContent =
      "投稿を読み込めませんでした";

  }

}


/* 投稿を表示 */

function displayPosts() {

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    allPosts.filter(post =>

      String(post.message)
        .toLowerCase()
        .includes(keyword)

    );


  postsContainer.innerHTML = "";


  if (filtered.length === 0) {

    postsContainer.innerHTML = `
      <div class="empty">
        まだ投稿がありません。<br>
        最初の愚痴を書いてみよう。
      </div>
    `;

    return;

  }


  filtered.forEach(post => {

    const article =
      document.createElement("article");

    article.className = "post";


    const content =
      document.createElement("div");

    content.className =
      "post-content";

    content.textContent =
      post.message;


    const info =
      document.createElement("div");

    info.className =
      "post-info";

    const date =
      new Date(post.created_at)
        .toLocaleString("ja-JP");

    info.textContent =
      "匿名ユーザー ・ " + date;


    const actions =
      document.createElement("div");

    actions.className =
      "actions";


    const likeButton =
      document.createElement("button");

    likeButton.className =
      "action";

    likeButton.type =
      "button";

    likeButton.textContent =
      "❤️ 共感 " +
      (post.likes || 0);


    const reportButton =
      document.createElement("button");

    reportButton.className =
      "action";

    reportButton.type =
      "button";

    reportButton.textContent =
      "🚨 通報";

    reportButton.onclick =
      function() {

        alert(
          "通報を受け付けました。"
        );

      };


    actions.appendChild(
      likeButton
    );

    actions.appendChild(
      reportButton
    );


    article.appendChild(
      content
    );

    article.appendChild(
      info
    );

    article.appendChild(
      actions
    );


    postsContainer.appendChild(
      article
    );

  });

}


/* 投稿する */

async function addPost() {

  const message =
    messageInput.value.trim();


  if (!message) {

    alert(
      "愚痴を書いてから投稿してね。"
    );

    return;

  }


  if (message.length > 1000) {

    alert(
      "1000文字以内で書いてね。"
    );

    return;

  }


  postButton.disabled =
    true;

  postButton.textContent =
    "投稿中…";


  try {

    const response =
      await fetch(
        "/api/posts",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    messageInput.value = "";

    await loadPosts();


  } catch (error) {

    console.error(error);

    alert(
      "投稿できませんでした。"
    );

  } finally {

    postButton.disabled =
      false;

    postButton.textContent =
      "投稿する";

  }

}


/* ボタン */

postButton.addEventListener(
  "click",
  addPost
);


/* 検索 */

searchInput.addEventListener(
  "input",
  displayPosts
);


/* 最初に読み込む */

loadPosts();


/* 3秒ごとに更新 */

setInterval(
  loadPosts,
  3000
);

</script>

</body>
</html>
